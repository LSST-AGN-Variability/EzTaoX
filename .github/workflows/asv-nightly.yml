# This workflow will run daily at 06:45.
# It will run benchmarks with airspeed velocity (asv),
# compare performance with the previous nightly build, fill in the sampled
# history of main on the dashboard, and publish the results.
name: Run benchmarks nightly job

on:
  schedule:
    - cron: 45 6 * * *
  workflow_dispatch:
  
env:
  PYTHON_VERSION: "3.12"
  ASV_VERSION: "0.6.5"
  WORKING_DIR: ${{github.workspace}}/benchmarks
  NIGHTLY_HASH_FILE: nightly-hash

jobs:
  asv-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{env.WORKING_DIR}}
    steps:
    - name: Set up Python ${{env.PYTHON_VERSION}}
      uses: actions/setup-python@v7
      with:
        python-version: ${{env.PYTHON_VERSION}}
    - name: Checkout main branch of the repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: pip install asv[virtualenv]==${{env.ASV_VERSION}}
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Create ASV machine config file
      run: asv machine --machine gh-runner --yes
    - name: Fetch previous results from the "benchmarks" branch
      run: |
        if git ls-remote --exit-code origin benchmarks > /dev/null 2>&1; then
          git merge origin/benchmarks \
            --allow-unrelated-histories \
            --no-commit
          mv ../_results .
        fi
    - name: Get nightly dates under comparison
      id: nightly-dates
      run: |
        echo "yesterday=$(date -d yesterday +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    # Cache only the hash file. Caching the whole benchmarks directory restored a
    # months-old asv.conf.json, suite and _results/benchmarks.json over the
    # checkout every night, which then got published as a 3-benchmark dashboard.
    - name: Use last nightly commit hash from cache
      uses: actions/cache@v6
      with:
        path: ${{env.WORKING_DIR}}/${{env.NIGHTLY_HASH_FILE}}
        key: nightly-hash-${{steps.nightly-dates.outputs.yesterday}}
    - name: Run comparison of main against last nightly build
      run: |
        HASH_FILE=${{env.NIGHTLY_HASH_FILE}}
        CURRENT_HASH=${{github.sha}}
        if [ -f $HASH_FILE ]; then
          PREV_HASH=$(cat $HASH_FILE)
          asv continuous $PREV_HASH $CURRENT_HASH --verbose || true
          asv compare $PREV_HASH $CURRENT_HASH --sort ratio --verbose
        fi
        echo $CURRENT_HASH > $HASH_FILE
    - name: Update last nightly hash in cache
      uses: actions/cache@v6
      with:
        path: ${{env.WORKING_DIR}}/${{env.NIGHTLY_HASH_FILE}}
        key: nightly-hash-${{steps.nightly-dates.outputs.today}}
    # Fill in a sample of commits after afe10654 (April 2026) so the dashboard
    # shows history; older commits predate the current fitter API and the
    # benchmark suite. The push-to-main workflow only benchmarks HEAD, so this
    # is where edits to benchmarks/ get re-run over past commits.
    - name: Run ASV over a sample of main history
      run: asv run afe10654..HEAD --steps 10 --skip-existing --verbose || true
    - name: Submit new results to the "benchmarks" branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: benchmarks
        folder: ${{env.WORKING_DIR}}/_results
        target-folder: _results
    - name: Generate dashboard HTML
      run: |
        asv show
        asv publish
    - name: Deploy to Github pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: ${{env.WORKING_DIR}}/_html
