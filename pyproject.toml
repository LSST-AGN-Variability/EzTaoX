
[project]
name = "eztaox"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Weixiang Yu", email = "astro.flyfish@gmail.com" }
]
description = "EzTaoX is a flexible framework for multi-wavelength and multi-survey AGN light-curve modeling using Gaussian Processes (GPs). Built on top of tinygp."
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.10, <3.13"
dependencies = [
    "tinygp (>=0.3.0,<0.4.0)",
    "jax (==0.4.31)",
    "jaxlib (==0.4.31)",
    "optax (>=0.2.5,<0.3.0)",
    "numpyro (>=0.17.0,<0.20.0)",
]

[project.urls]
"Source Code" = "https://github.com/LSST-AGN-Variability/eztaox"

# Development and testing dependencies, kept in one list that both Poetry and CI read.
#   Local setup:      poetry install --extras dev
#   Add a package:    poetry add --optional dev <package>
#   CI installs with: pip install -e '.[dev]'  (keep the single quotes on a mac)
[project.optional-dependencies]
dev = [
    "arviz>=0.20,<=1.0.0", # Used in notebooks to inspect MCMC results
    "asv[virtualenv]==0.6.5", # Used to compute performance benchmarks
    "black>=26.1", # Used for static linting of files
    "celerite>=0.4", # Used for testing against reference celerite GP likelihoods
    "eztao>=0.5", # Used for testing against EzTao calculations that are known to be correct
    "ipykernel>=6.29", # Runs the example notebooks
    "ipywidgets>=8.1.5", # Notebook progress bars and widgets
    "joblib>=1.3", # Used for parallelization in tests
    "jupyter", # Clears output from Jupyter notebooks
    "matplotlib>3.7", # Used in notebooks and scripts
    "nox>=2025.0", # Runs the test suite against each supported Python version
    "pre-commit>=3.5", # Used to run checks before finalizing a git commit
    "pytest>=8.0",
    "pytest-cov>=7.1", # Used to report total code coverage
    "ruff>=0.15", # Used for static linting of files
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/eztaox/_version.py"

[tool.poetry]
# not used for building
version = "0.1.0"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
]

[tool.pydoclint]
style = 'google'
exclude = '\.git|\.tox|tests/benchmarks'

[tool.black]
line-length = 88

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "E741",    # Allow ambiguous variable names
    "PLR0911", # Allow many return statements
    "PLR0913", # Allow many arguments to functions
    "PLR0915", # Allow many statements
    "PLR2004", # Allow magic numbers in comparisons
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
    "N803", # Argument name should be lowercase
    "N806", # Variable in function should be lowercase
    "N815", # Variable in class scope should not be mixedCase
]
exclude = ["docs/*", "scripts/*"]

[tool.coverage.run]
omit=["src/eztaox/_version.py"]
